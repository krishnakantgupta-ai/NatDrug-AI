# Optional: copy this file to the repository ROOT at .github/workflows/natdrug_v2_tests.yml to enable CI.
# GitHub ignores workflows under research_v2/.github/.
name: NatDrug-AI v2 research checks
on:
  push:
    paths: ["research_v2/**"]
  pull_request:
    paths: ["research_v2/**"]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas
      - run: python -m unittest discover -s research_v2/tests -v
      - run: python -m compileall -q research_v2/code
